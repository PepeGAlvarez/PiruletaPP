<div class="contenedorSemaforo">
@for (i of repeticiones; track i){          <!-- usando una variable repeticiones en el .ts -->
 <!-- (i of [1, 2, 3, 4, 5]; track i)  -->


    <div class="cajita"> 

        @if(contador() >= 4) {
            <div class ="circulo rojo"> </div>
            } @else {
            <div class ="circulo gris"> </div>      <!-- Lo pintamos de gris si no es rojo, para que no descuadre. Lo mismo con el resto -->
            }
            @if(contador() > 0 && contador() <= 3) {
            <div class ="circulo naranja"> </div>
            } @else {
            <div class ="circulo gris"> </div>
            }
            @if(contador() === 0) {
            <div class ="circulo verde"> </div>
            } @else {
            <div class ="circulo gris"> </div>
            }

    </div>
}
</div>

<div class="botones">

    <h1 [style.color]="colorin()">{{contador()}}</h1>    <!-- Ponems el texto en "colorin" y hacemos binding de interpolación con {{contador}}   -->


    <!-- // Binding de eventos con click ratón y botones de angular material, llamando a las fx del TS -->
    <div class="fila-botones">
        <button matButton="filled" (click)="incrementar()">Incrementar</button> 
        <button matButton="outlined" (click)="decrementar()">Decrementar</button>
        <button matButton="tonal" (click)="resetear()">Resetear</button>
    </div>
</div>
