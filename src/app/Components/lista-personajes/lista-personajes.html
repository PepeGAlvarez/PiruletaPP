<div class="contenedor-personajes">
    <ul>
        @for (personaje of personajes; track personaje.nombre) {
            <li>
                <img [alt]="personaje.nombre" [src]="personaje.imagen" width="40" height="40">   <!-- Binding de cada imagen por [src] y de los otros  {{campos}} -->

                {{ personaje.nombre }}
                : {{ personaje.descripcion }}
            </li>
        }
    </ul>
</div>
